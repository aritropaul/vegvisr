name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - run: brew install xcodegen

      - name: Build
        working-directory: apple
        run: |
          set -o pipefail
          xcodegen generate
          # `generic/platform=macOS` plus explicit ARCHS, because a bare
          # `platform=macOS` destination builds for the runner's own
          # architecture — which shipped an arm64-only app while the
          # deployment target claims macOS 14, a version that still runs on
          # Intel. Verified with `lipo -archs`.
          # The tag is the version. Overriding it here means a release cannot
          # disagree with its own tag, and project.yml's value stays a local
          # default rather than something to remember to bump.
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          xcodebuild -project Vegvisr.xcodeproj -scheme Vegvisr \
            -configuration Release -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${tag#v}" \
            -derivedDataPath build build | tail -20

      - name: Package
        id: package
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          app=$(find apple/build/Build/Products/Release -maxdepth 1 -name 'Vegvisr.app' | head -1)
          test -n "$app" || { echo "::error::no Vegvisr.app in the build products"; exit 1; }
          # ditto, not zip: a .app is a bundle with symlinks, and zip flattens
          # them into broken copies.
          # Fail loudly rather than publish an app that misreports itself.
          got=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
                  "$app/Contents/Info.plist")
          echo "bundle version: $got"
          if [ "$got" != "${tag#v}" ]; then
            echo "::error::bundle says $got, tag says ${tag#v}"
            exit 1
          fi
          # Fail loudly rather than publish a half-platform app.
          archs=$(lipo -archs "$app/Contents/MacOS/Vegvisr")
          echo "architectures: $archs"
          for want in arm64 x86_64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::$want missing from the binary"; exit 1 ;;
            esac
          done
          ditto -c -k --keepParent "$app" "Vegvisr-macOS-${tag}.zip"
          echo "zip=Vegvisr-macOS-${tag}.zip" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          ls -lh "Vegvisr-macOS-${tag}.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.package.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.package.outputs.zip }}" --clobber
          else
            gh release create "$tag" "${{ steps.package.outputs.zip }}" \
              --title "Vegvisr $tag" --notes-file .github/release-notes.md
          fi
