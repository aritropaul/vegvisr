name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Rust generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/crates/worldgen/target
          key: cargo-${{ runner.os }}-${{ hashFiles('web/crates/worldgen/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        working-directory: web/crates/worldgen
        run: cargo test --release

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: typecheck
        working-directory: web
        run: bunx tsc --noEmit
      # Deliberately `vite build`, not `bun run build`: src/wasm/ is committed,
      # so a deploy needs no Rust toolchain. This job builds what Vercel builds.
      - name: build
        working-directory: web
        run: bunx vite build

  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Require a macOS 26 SDK
        # Liquid Glass (.glassEffect) only exists in the 26 SDK. Without this
        # the failure is a wall of Swift errors instead of one legible line.
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          major=${sdk%%.*}
          if [ "$major" -lt 26 ]; then
            echo "::error::need the macOS 26 SDK or newer, runner has $sdk"
            exit 1
          fi
      - run: brew install xcodegen
      - name: Generate the project
        working-directory: apple
        run: xcodegen generate
      - name: Build for macOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Vegvisr.xcodeproj -scheme Vegvisr \
            -configuration Release -destination 'platform=macOS' \
            build | tail -40
      - name: Build for iOS
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Vegvisr.xcodeproj -scheme Vegvisr \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            build | tail -40

  parity:
    name: Swift/Rust parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/crates/worldgen/target
          key: parity-${{ runner.os }}-${{ hashFiles('web/crates/worldgen/Cargo.lock') }}
          restore-keys: parity-${{ runner.os }}-
      # Runs both generators over the same seed and asserts the documented
      # bound on their divergence. See scripts/parity.py for what is exact and
      # what is merely bounded, and why.
      - run: ./scripts/parity.sh
